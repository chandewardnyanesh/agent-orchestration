version: "3.9"

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  orchestration:
    driver: bridge

# ── Reusable fragments ────────────────────────────────────────────────────────
x-common: &common
  networks: [orchestration]
  restart: unless-stopped

x-app-base: &app-base
  <<: *common
  build:
    context: .
    target: runtime
  env_file: .env
  volumes:
    - .:/app:delegated
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── Core API ──────────────────────────────────────────────────────────────
  api:
    <<: *app-base
    command: >
      uvicorn orchestrator.main:app
        --host 0.0.0.0
        --port 8000
        --workers 2
        --log-level info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ── Celery worker ─────────────────────────────────────────────────────────
  worker:
    <<: *app-base
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ── HITL Review UI ────────────────────────────────────────────────────────
  review-ui:
    <<: *app-base
    command: >
      streamlit run ui/review/app.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true
        --server.fileWatcherType none
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Trace Explorer UI ─────────────────────────────────────────────────────
  trace-ui:
    <<: *app-base
    command: >
      streamlit run ui/traces/app.py
        --server.port 8502
        --server.address 0.0.0.0
        --server.headless true
        --server.fileWatcherType none
    ports:
      - "8502:8502"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ── DB migration (one-shot) ────────────────────────────────────────────────
  migrate:
    <<: *app-base
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Infrastructure ────────────────────────────────────────────────────────
  redis:
    <<: *common
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    <<: *common
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB:       ${POSTGRES_DB:-orchestration}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-orchestration}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  chromadb:
    <<: *common
    image: chromadb/chroma:latest
    ports:
      - "8003:8000"
    volumes:
      - chroma_data:/chroma/.chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  redis_data:
  postgres_data:
  chroma_data:
